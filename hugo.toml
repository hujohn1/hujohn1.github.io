baseURL = 'https://hujohn1.github.io/'
locale = 'en-us'
title = 'John Hu'
theme = 'hugo-theme-console'

[[module.imports]]
  path = "github.com/mrmierzejewski/hugo-theme-console"

[params]
  description = "Engineering student at Duke. Mechatronics, power electronics, analog circuits, and building things."
  animateStyle = "animate-fade-up"
  titleCutting = true

[[params.navlinks]]
  name = "About"
  url = "/about/"

[[params.navlinks]]
  name = "Posts"
  url = "/posts/"

[[params.navlinks]]
  name = "Photos"
  url = "/photos/"

[[params.navlinks]]
  name = "Resume"
  url = "/resume/"

[markup.goldmark.renderer]
  unsafe = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'